; Example configuration for offline compatibility runs and Windows Npcap live capture.
; Choose an interface with --list-interfaces, or use \Device\NPF_Loopback for localhost traffic.

[general]
min_saved_bytes_per_packet = 16

[capture]
backend = npcap
; Copy a value from PcapConstrictorWinPacket --list-interfaces.
; Example:
; interface = \Device\NPF_{YOUR-INTERFACE-GUID}
; Loopback example for localhost traffic:
; interface = \Device\NPF_Loopback
interface =
; Simple output filename for a first run.
output = output.pcap
; Set to false to capture only traffic normally delivered to this adapter.
; On Wi-Fi this is not monitor mode.
; On \Device\NPF_Loopback, promiscuous mode is accepted but not meaningful.
promiscuous = true
; default_snaplen controls the requested capture snaplen passed to Npcap/libpcap.
; 65535 is a typical full-packet snaplen for a first run.
default_snaplen = 65535
; max_capture_len is the maximum packet length PcapConstrictorWinPacket will save.
max_capture_len = 65535
; Bounded defaults are safer for a first live smoke test.
; Capture stops when either max_packets or duration_sec is reached.
max_packets = 1000
duration_sec = 30
read_timeout_ms = 100

[tls]
enabled = true
ports = 443, 8443
app_data_keep_record_bytes = 256
app_data_continuation_keep_bytes = 64
; PcapConstrictorWinPacket currently supports only final_only continuation behavior.
; TLS stream and bulk continuation policies are not supported in this recorder.
app_data_continuation_policy = final_only

[quic]
enabled = true
ports = 443, 8443
short_header_keep_packet_bytes = 64
require_dcid_match = true
allow_short_header_without_known_dcid = false

[stats]
enabled = true
