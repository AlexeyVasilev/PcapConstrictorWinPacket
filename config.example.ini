; Example configuration for offline compatibility runs and future Windows Npcap live capture.
; Live capture is intentionally not implemented in this milestone.

[general]
min_saved_bytes_per_packet = 16

[capture]
backend = npcap
interface =
output = output.pcap
promiscuous = true
default_snaplen = 65535
max_capture_len = 65535
max_packets = 0
duration_sec = 0
read_timeout_ms = 100

[tls]
enabled = true
ports = 443, 8443
app_data_keep_record_bytes = 256
app_data_continuation_keep_bytes = 64
app_data_continuation_policy = final_only

[quic]
enabled = true
ports = 443, 8443
short_header_keep_packet_bytes = 64
require_dcid_match = true
allow_short_header_without_known_dcid = false

[stats]
enabled = true
